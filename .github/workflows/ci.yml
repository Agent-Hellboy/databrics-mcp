name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.7
          args: check .

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.7
          args: format --check .

      - name: Compile Python sources
        run: python -m compileall -q mcp_databricks tests
