name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.7
          args: check .

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.7
          args: format --check .

      - name: Compile Python sources
        run: python -m compileall -q mcp_databricks tests

      - name: Run tests
        run: |
          uv sync --frozen --extra dev
          uv run pytest

  docker-build:
    name: Docker build (documented command)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Runs the exact command deploy/README.md documents, with BuildKit
      # disabled, so a Dockerfile change that only works with buildx (which
      # isn't guaranteed on a stock Docker install) fails here instead of
      # silently landing.
      - name: Build deploy/Dockerfile with the plain docker CLI
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build -f deploy/Dockerfile -t databricks-mcp:ci .
