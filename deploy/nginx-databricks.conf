# Public URL: https://mcp.example.com/databricks/mcp
# Upstream: databricks-mcp-server on 127.0.0.1:6328
# OAuth endpoints live on the separately deployed authorization server. This
# service owns MCP tools and the RFC 9728 protected-resource document.
# The "/mcp" suffix below is MCP_PATH's default. Setting MCP_PATH moves the
# upstream route, the resource identifier, and the path the protected-resource
# document is published at, so every occurrence here moves with it.
location = /databricks {
    proxy_pass http://127.0.0.1:6328/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /databricks;
}

location = /databricks/mcp {
    proxy_pass http://127.0.0.1:6328/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /databricks;
}

location = /.well-known/oauth-protected-resource/databricks/mcp {
    proxy_pass http://127.0.0.1:6328/.well-known/oauth-protected-resource/databricks/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /databricks;
}

# If the authorization server requires a callback through this hostname, route
# it to that service. Keep the redirect URI registered with the authorization
# server exactly equal to the public URL.
location = /databricks/callback {
    return 302 /auth/callback$is_args$args;
}

# The proxy's base URL is /databricks, so it builds its consent URL there as
# The authorization service owns consent. Proxy GET and POST rather than
# redirecting if it uses this public hostname for its consent route.
location = /databricks/consent {
    proxy_pass http://127.0.0.1:6329/consent;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /auth;
}
