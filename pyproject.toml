[project]
name = "databricks-mcp"
version = "0.2.2"
description = "Read-only, per-user Databricks MCP server with OAuth SSO"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.80,<1",
    "fastmcp>=3.4.4,<4",
    "mcp>=1.27,<2",
    "pyjwt>=2.8,<3",
    "mcp-auth-client @ git+https://github.com/Agent-Hellboy/mcp-auth.git@00614c3aa65efa6908c5a7ce712daa129bc46d99#subdirectory=auth-client/python",
    "uvicorn>=0.30,<1",
    "sqlglot>=25,<30",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_databricks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
